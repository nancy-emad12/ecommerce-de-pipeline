# Extra services started together with Airflow by `astro dev start`.
# Astro's own containers (scheduler, api-server, dag-processor, triggerer, postgres)
# live on the "airflow" network; everything here joins the same network.
#
# Host ports:  Airflow UI 8080 | Spark master UI 8090 | Spark worker UI 8091 | DWH Postgres 5433
services:
  spark-master:
    build: ./docker/spark
    image: ecommerce-spark:4.0.1
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8090:8080"
    volumes:
      - ./include:/usr/local/airflow/include
    networks:
      - airflow

  spark-worker:
    build: ./docker/spark
    image: ecommerce-spark:4.0.1
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8091:8081"
    volumes:
      - ./include:/usr/local/airflow/include   # same path as in Airflow -> same file paths everywhere
    networks:
      - airflow

  dwh-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: ecommerce_dwh
    ports:
      - "5433:5432"
    volumes:
      - dwh_pgdata:/var/lib/postgresql/data
    networks:
      - airflow

volumes:
  dwh_pgdata:
